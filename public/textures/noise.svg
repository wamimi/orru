<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="4" seed="27" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.7" exponent="0.85" offset="-.18"/>
      <feFuncG type="gamma" amplitude="1.7" exponent="0.85" offset="-.18"/>
      <feFuncB type="gamma" amplitude="1.7" exponent="0.85" offset="-.18"/>
    </feComponentTransfer>
  </filter>
  <filter id="grit" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.55" numOctaves="3" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.4" exponent="1.1" offset="-.12"/>
      <feFuncG type="gamma" amplitude="1.4" exponent="1.1" offset="-.12"/>
      <feFuncB type="gamma" amplitude="1.4" exponent="1.1" offset="-.12"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="1"/>
  <rect width="100%" height="100%" filter="url(#grit)" opacity=".55" style="mix-blend-mode:overlay"/>
</svg>
