name: payroll

# Runs DemoPayroll on Ethereum Sepolia so payment history accrues without a
# laptop staying awake. Hourly against four-hour periods: three of four firings
# are expected to skip, and that redundancy is the point — producing a gap in
# the period sequence needs four consecutive failures, and a gap can never be
# backfilled.
#
# GitHub's scheduler is best-effort and can run late or occasionally skip under
# load. Settlement catches up in order, one period per run, so a missed firing
# is recovered rather than lost. Manual runs are always available.
permissions:
  contents: read

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: payroll
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # This action installs the `cast` binary that later handles the keeper
      # key, and the repository pins Foundry 1.2.3 for the verifier build.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - name: Settle the due period, if any
        env:
          RPC: ${{ secrets.SEPOLIA_RPC_URL }}
          PAYROLL: ${{ secrets.DEMO_PAYROLL_ADDRESS }}
          KEEPER_PK: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: |
          # -e matters here: without it a failed read leaves an empty variable,
          # the numeric test errors and evaluates false, and execution falls
          # through to cast send.
          set -euo pipefail

          chain=$(cast chain-id --rpc-url "$RPC")
          if [ "$chain" != "11155111" ]; then
            echo "::error::RPC reports chain $chain, expected Sepolia (11155111)"
            exit 1
          fi

          if [ "$(cast code "$PAYROLL" --rpc-url "$RPC" | tr -d '[:space:]' | wc -c)" -le 2 ]; then
            echo "::error::no contract code at DEMO_PAYROLL_ADDRESS $PAYROLL"
            exit 1
          fi

          read_uint() {
            local out
            out=$(cast call "$PAYROLL" "$1" --rpc-url "$RPC" | awk '{print $1}')
            case "${out:-}" in
              ''|*[!0-9]*)
                echo "::error::$1 returned '${out:-}', not a number" >&2
                return 1
                ;;
            esac
            printf '%s' "$out"
          }

          current=$(read_uint "currentPeriod()(uint256)")
          next=$(read_uint    "nextDuePeriod()(uint256)")
          last=$(read_uint    "lastPaidPeriod()(uint256)")
          short=$(read_uint   "fundingShortfall()(uint256)")

          echo "currentPeriod=$current nextDue=$next lastPaid=$last shortfall=$short"

          if [ "$short" != "0" ]; then
            echo "::warning::Underfunded by $short USDC base units (6dp). Top up DemoPayroll — periods are at risk."
          fi

          if [ "$next" -gt "$current" ]; then
            echo "Nothing due yet (next $next > current $current). Skipping."
            exit 0
          fi

          echo "Settling period $next..."
          cast send "$PAYROLL" "runPayroll()" \
            --rpc-url "$RPC" \
            --private-key "$KEEPER_PK" \
            --json | tee result.json

          status=$(python3 -c "import json;print(json.load(open('result.json')).get('status',''))")
          echo "status=$status"
          [ "$status" = "0x1" ] || { echo "::error::runPayroll reverted"; exit 1; }

      - name: Report
        if: failure()
        run: echo "::error::Payroll run failed. A period is at risk — check the contract and the keeper balance."
